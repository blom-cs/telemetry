[package]
name = "telemetry"
version = "0.0.1"
edition = "2024"
authors = ["Dawid Blom"]
license = "MIT"

[lib]
path = "src/lib.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
time = { version = "0.3", default-features = false, features = ["std"] }
