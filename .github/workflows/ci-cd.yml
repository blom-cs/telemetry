name: CI/CD

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml selects clang and lld. The GitHub runner has neither.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker=cc"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --all-features

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    needs: [build]
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage check
        run: |
          set -euo pipefail
          report=target/llvm-cov-summary.json
          mkdir -p target
          # Line and function floors are enforced by cargo-llvm-cov.
          # Branch coverage has no matching flag. The JSON summary is
          # compared numerically: a text-report string compare treats
          # 100.00% as less than 80.00%, and "<" inside [ ] is a redirect.
          cargo +nightly llvm-cov \
            --all-features \
            --workspace \
            --branch \
            --fail-under-lines 100 \
            --fail-under-functions 100 \
            --json \
            --summary-only \
            --output-path "$report"
          python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          def totals(kind):
              count = 0
              covered = 0
              for entry in payload["data"]:
                  item = entry["totals"][kind]
                  count += int(item["count"])
                  covered += int(item["covered"])
              return count, covered

          for kind in ("lines", "functions", "regions", "branches"):
              count, covered = totals(kind)
              percent = 0.0 if count == 0 else covered * 100.0 / count
              print(f"{kind}: {percent:.2f}% ({covered}/{count})")

          count, covered = totals("branches")
          if count == 0 or covered * 100 < 80 * count:
              percent = 0.0 if count == 0 else covered * 100.0 / count
              print(
                  f"branch coverage {percent:.2f}% is below 80%",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
