name: CI/CD

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml selects clang and lld. The GitHub runner has neither.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker=cc"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --all-features

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    needs: [build]
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage check
        run: |
          set -euo pipefail
          report=target/llvm-cov-summary.json
          mkdir -p target
          # One gate: the workspace total, not a separate floor for each
          # metric or each file. The total sums lines, functions, regions,
          # and branches from the summary totals.
          cargo +nightly llvm-cov \
            --all-features \
            --workspace \
            --branch \
            --json \
            --summary-only \
            --output-path "$report"
          python3 - "$report" <<'PY'
          import json
          import sys

          kinds = ("lines", "functions", "regions", "branches")

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          combined = {kind: [0, 0] for kind in kinds}
          for entry in payload["data"]:
              totals = entry["totals"]
              for kind in kinds:
                  item = totals[kind]
                  combined[kind][0] += int(item["covered"])
                  combined[kind][1] += int(item["count"])

          covered = 0
          count = 0
          for kind in kinds:
              kind_covered, kind_count = combined[kind]
              covered += kind_covered
              count += kind_count
              percent = 0.0 if kind_count == 0 else kind_covered * 100.0 / kind_count
              print(f"{kind}: {percent:.2f}% ({kind_covered}/{kind_count})")

          percent = 0.0 if count == 0 else covered * 100.0 / count
          print(f"total: {percent:.2f}% ({covered}/{count})")
          if count == 0 or covered * 100 < 80 * count:
              print(f"total coverage {percent:.2f}% is below 80%", file=sys.stderr)
              sys.exit(1)
          PY

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
